<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101A2B" />
    <meta name="description" content="GenaroPOS - Sistema de Punto de Venta ágil, táctil y resiliente sin conexión" />
    <link rel="manifest" href="/manifest.json" />
    <title>GenaroPOS — Caja</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("genaro_pos_theme_pref") || "dark";
          var resolved =
            pref === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : pref === "light"
              ? "light"
              : "dark";
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.setAttribute("data-theme-mode", pref);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
